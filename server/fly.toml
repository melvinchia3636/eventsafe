# fly.toml app configuration file for the EventSafe API
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eventsafe-api'
primary_region = 'sin'

[build]
dockerfile = './Dockerfile'

[build.args]
BUN_VERSION = '1.4.3'

[deploy]

[env]
  CORS_ORIGINS = 'http://localhost:5173,https://eventsafe.melvinchia.dev'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'off'
auto_start_machines = true
min_machines_running = 1
max_machines_running = 1
processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '5s'

[[vm]]
memory = '1gb'
cpus = 1
memory_mb = 1024
